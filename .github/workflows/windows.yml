# Lean Windows (MSVC) build for this fork.
#
# This is separate from the upstream build.yml so the fork has one fast,
# focused Windows check. It skips FFmpeg (only used for frame dumping) and
# Discord Rich Presence, which removes the slow vcpkg FFmpeg build.
# Qt is downloaded automatically by CMake (see CMakeModules/DownloadExternals.cmake).
name: windows-build

on:
  push:
    branches: [ master, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Disable line ending translation
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up ccache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-msvc-${{ github.sha }}
          restore-keys: |
            windows-msvc-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: choco install -y --no-progress ccache ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DENABLE_FFMPEG=OFF
          -DENABLE_DISCORD_RPC=OFF

      - name: Build
        run: cmake --build build

      - name: Bundle
        run: cmake --build build --target bundle

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-${{ github.sha }}
          path: build/bundle/
          if-no-files-found: error

  # Publishes the build to the repo's Releases page.
  # - Every push to master replaces the "latest" pre-release (a rolling dev build).
  # - Pushing a tag like v0.1.0 creates a permanent, versioned release.
  release:
    needs: msvc
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: windows-msvc-${{ github.sha }}
          path: azahar-windows

      - name: Zip build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NAME="azahar-windows-msvc-${GITHUB_REF_NAME}"
          else
            NAME="azahar-windows-msvc-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          mv azahar-windows "$NAME"
          zip -qr "$NAME.zip" "$NAME"
          echo "ZIP=$NAME.zip" >> "$GITHUB_ENV"

      - name: Publish rolling "latest" pre-release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$ZIP" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest development build" \
            --notes "Automatic Windows build of master at ${GITHUB_SHA::7}. Download the zip, extract it anywhere, and run azahar.exe. This release is replaced on every push to master."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
